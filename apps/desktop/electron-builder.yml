# Trail Desktop packaging — bundled `out/` only (see performance briefing).
appId: com.trailpm.desktop
productName: Trail
copyright: Copyright © Trail
electronVersion: 33.2.1
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  - "!node_modules"
  - "!**/*.map"

asar: true
compression: maximum

electronLanguages:
  - en
  - nl

asarUnpack:
  - "**/*.node"

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false

win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false

publish:
  provider: github
  releaseType: release

afterPack: scripts/after-pack.cjs